<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>GitLab Jira Label Sync</h1>
    <div id="status" class="status"></div>

    <div id="gitlab-view">
      <div id="mr-list" class="mr-list"></div>
      <button id="sync-btn" class="btn-primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg> Sync Labels</button>
      <button id="fix-mrs-btn" class="btn-secondary" style="display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Fix Broken MR Targets</button>
      <div id="progress" class="progress"></div>
      <div id="results" class="results"></div>
    </div>

    <div id="jira-view" style="display:none">
      <div id="jira-ticket" class="jira-ticket"></div>
      <button id="lookup-btn" class="btn-primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Lookup Merge Requests</button>
      <div id="jira-results" class="results"></div>
    </div>

    <div id="tag-view" style="display:none">
      <div class="tag-view-header">🏷 Bulk Tag Creator</div>

      <div class="form-group">
        <label>Source Branch</label>
        <div class="tag-branch-radios">
          <label class="tag-branch-radio"><input type="radio" name="tag-source-branch" value="main"> main</label>
          <label class="tag-branch-radio"><input type="radio" name="tag-source-branch" value="release" checked> release</label>
          <label class="tag-branch-radio"><input type="radio" name="tag-source-branch" value="other"> other</label>
        </div>
        <input type="text" id="tag-source-branch-other" class="input-field input-full" placeholder="e.g. feature/branch" style="display:none">
      </div>

      <div class="form-group">
        <label for="tag-services">Services (comma-separated)</label>
        <details class="recent-services-details">
          <summary class="recent-services-summary">Recent services</summary>
          <div id="tag-recent-services" class="recent-services-list"></div>
        </details>
        <textarea id="tag-services" rows="3" placeholder="service-orders, service-catalogs, service-store"></textarea>
      </div>

      <div class="form-group">
        <label>Version</label>
        <div class="tag-version-row">
          <div class="tag-version-group" style="flex:1.6">
            <span class="tag-version-label">Date</span>
            <input type="text" id="tag-date" class="input-field" placeholder="YYYY.MM.DD">
          </div>
          <div class="tag-version-group" style="flex:0.7">
            <span class="tag-version-label">Prefix</span>
            <input type="text" id="tag-patch-prefix" class="input-field" value="p">
          </div>
          <div class="tag-version-group" style="flex:0.8">
            <span class="tag-version-label">Patch</span>
            <input type="number" id="tag-patch" class="input-field" min="1" placeholder="auto">
          </div>
          <div class="tag-version-group" style="flex:1">
            <span class="tag-version-label">Env</span>
            <input type="text" id="tag-env" class="input-field" value="stag">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Preview</label>
        <div id="tag-preview"></div>
      </div>

      <div class="form-group">
        <label for="tag-message">Tag Message (optional)</label>
        <textarea id="tag-message" rows="2" placeholder="Optional tag message applied to all tags"></textarea>
      </div>

      <div class="form-group">
        <label><input type="checkbox" id="tag-force-create"> Force create (delete existing tag first)</label>
      </div>

      <button id="create-tags-btn" class="btn-primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg> Create Tags</button>
      <div id="tag-results" class="results"></div>

      <hr style="margin:16px 0;border:none;border-top:1px solid #eee">

      <div class="form-group">
        <label>🗑 Delete Old Tags</label>
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;max-width:100%;min-width:0">
          <span style="font-size:11px;flex-shrink:0">Older than</span>
          <input type="number" id="delete-tags-days" class="input-field" style="width:60px;flex-shrink:0" min="1" value="30">
          <span style="font-size:11px;flex-shrink:0">days</span>
          <input type="text" id="delete-tags-pattern" class="input-field" style="flex:1;min-width:0" placeholder="Tag pattern (e.g. v2024*)">
        </div>
        <div style="display:flex;gap:6px">
          <button id="search-old-tags-btn" class="btn-primary" style="flex:1;font-size:11px;padding:6px">🔍 Search Tags</button>
          <button id="delete-old-tags-btn" class="btn-primary" style="flex:1;font-size:11px;padding:6px;background:#c62828" disabled>🗑 Delete Found Tags</button>
        </div>
        <div id="delete-tags-results" class="results"></div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-grid">
        <button class="footer-btn" id="create-mr-testing-btn">✚ MR → testing</button>
        <button class="footer-btn" id="create-mr-main-btn">✚ MR → main</button>
        <button class="footer-btn" id="create-mr-main-to-testing-btn">⇄ main → testing</button>
        <button class="footer-btn" id="create-mr-main-to-release-btn">⇄ main → MR</button>
        <button class="footer-btn footer-btn--accent" id="create-tags-btn-footer">🏷 Bulk Tags</button>
        <button class="footer-btn footer-btn--muted" id="options-link">⚙ Settings</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
