<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>GitLab Jira Label Sync</h1>
    <div id="status" class="status"></div>

    <div id="gitlab-view">
      <div id="mr-list" class="mr-list"></div>
      <button id="sync-btn" class="btn-primary">Sync Labels</button>
      <button id="fix-mrs-btn" class="btn-secondary">Fix Broken MR Targets</button>
      <div id="progress" class="progress"></div>
      <div id="results" class="results"></div>
    </div>

    <div id="jira-view" style="display:none">
      <div id="jira-ticket" class="jira-ticket"></div>
      <button id="lookup-btn" class="btn-primary">Lookup Merge Requests</button>
      <div id="jira-results" class="results"></div>
    </div>

    <div class="footer">
      <a href="#" id="create-mr-testing-btn">New MR → testing</a>
      &nbsp;·&nbsp;
      <a href="#" id="create-mr-main-btn">New MR → main</a>
      &nbsp;·&nbsp;
      <a href="#" id="options-link">Settings</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
